server {
    listen 80;
    listen [::]:80;
    server_name petmind.vip www.petmind.vip;

    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name petmind.vip www.petmind.vip;

    # SSL 证书（宝塔申请后路径如下，按实际修改）
    ssl_certificate     /www/server/panel/vhost/cert/petmind.vip/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/petmind.vip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 日志
    access_log  /www/wwwlogs/petmind.vip.log;
    error_log   /www/wwwlogs/petmind.vip.error.log;

    # 反向代理到 Next.js（PM2 跑在 3000 端口）
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # History 模式支持：所有路由都交给 Next.js 处理
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Next.js 静态资源缓存
    location /_next/static/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires          365d;
        add_header       Cache-Control "public, immutable";
    }

    # public 目录静态资源
    location /public/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires          30d;
        add_header       Cache-Control "public";
    }

    # 安全头
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # 隐藏 Nginx 版本
    server_tokens off;
}
